<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Soft Romantic Blush -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F5"/>
      <stop offset="100%" stop-color="#F5E6E0"/>
    </linearGradient>

    <!-- Gold Gradient for Monogram & Border -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2CA9E"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#A8824B"/>
    </linearGradient>

    <!-- Shadow for luxury depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#6B5B5B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2, 1.5" opacity="0.7"/>

  <!-- Monogram text 'GM' -->
  <text x="32" y="39"
        text-anchor="middle"
        font-family="'Cormorant Garamond', 'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="23"
        font-weight="600"
        letter-spacing="1"
        fill="url(#goldGrad)"
        filter="url(#softShadow)">GM</text>
</svg>

